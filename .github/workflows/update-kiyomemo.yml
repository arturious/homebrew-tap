name: Update Kiyomemo cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Update cask from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/arturious/kiyomemo/releases/latest --jq .tag_name)"
          version="${tag#v}"
          url="https://github.com/arturious/kiyomemo/releases/download/$tag/Kiyomemo-$tag.dmg"

          curl --fail --location --output kiyomemo.dmg "$url"
          sha256="$(shasum --algorithm 256 kiyomemo.dmg | awk '{ print $1 }')"

          ruby - "$version" "$sha256" <<'RUBY'
          path = "Casks/kiyomemo.rb"
          contents = File.read(path)
          contents.sub!(/version "[^"]+"/, %(version "#{ARGV[0]}"))
          contents.sub!(/sha256 "[^"]+"/, %(sha256 "#{ARGV[1]}"))
          File.write(path, contents)
          RUBY

      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/kiyomemo.rb
          git commit -m "Update Kiyomemo cask"
          git push
